---
name: Setup UV Environment
description: Install Python, cache uv environments, and sync dependencies for CI jobs.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"

  uv-sync-flags:
    description: Flags passed to `uv sync`
    required: false
    default: "--all-extras"

  cache-key-prefix:
    description: Prefix used for caching uv environments
    required: false
    default: uv

  lockfile:
    description: Lockfile path hashed for cache invalidation
    required: false
    default: uv.lock

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

    - name: Cache uv environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key-prefix }}-

    - name: Sync dependencies
      shell: bash
      run: |
        set -eo pipefail
        uv sync ${{ inputs.uv-sync-flags }}
