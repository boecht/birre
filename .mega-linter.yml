---
# MegaLinter configuration for BiRRe
# https://megalinter.io/configuration/

# Explicit linter list: only checks that apply to this repository.
ENABLE_LINTERS:
  # Python
  - PYTHON_PYRIGHT
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  # Formats
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  # Tooling
  - ACTION_ACTIONLINT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  # Repository
  - REPOSITORY_SYFT

# Linters allowed to apply fixes (safe formatting)
APPLY_FIXES:
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF_FORMAT

# Reporters
GITHUB_STATUS_REPORTER: true  # default: false
MARKDOWN_SUMMARY_REPORTER: true  # default: false
SARIF_REPORTER: true  # default: false

# Exclude generated, archived, or local-only paths before linters see files.
# Keep .pre-commit-config.yaml and markdownlint ignores aligned.
FILTER_REGEX_EXCLUDE: >-
  (\.owlbear/|docs/apis/|src/birre/resources/apis/)

ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .venv
  - .ruff_cache
  - __pycache__
  - dist
  - megalinter-reports
  - node_modules

# Secured environment variables (to avoid leaking in reports)
SECURED_ENV_VARIABLES:
  - BITSIGHT_API_KEY

############################################
# Linter-specific configuration
############################################

# Actionlint: restrict scope to GitHub workflow directory explicitly
ACTION_ACTIONLINT_FILTER_REGEX_INCLUDE: '^(\.github/workflows/.*\.ya?ml)$'

# EditorConfig Checker (requires .editorconfig file at repo root).
# Ruff handles Python indentation; this avoids false positives in docstrings.
EDITORCONFIG_EDITORCONFIG_CHECKER_ARGUMENTS: "-f github-actions --disable-indent-size"

# JSON Jsonlint
JSON_JSONLINT_ARGUMENTS: "--quiet"

# Markdown Lint
MARKDOWN_MARKDOWNLINT_ARGUMENTS: "--fix"
MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: false

# Pyright strict typing config via pyproject
PYTHON_PYRIGHT_CLI_LINT_MODE: project
PYTHON_PYRIGHT_CONFIG_FILE: pyproject.toml

# Python Ruff (lint) uses pyproject.toml config; ensure formatting style is ruff
PYTHON_DEFAULT_STYLE: ruff
PYTHON_RUFF_CLI_LINT_MODE: project
PYTHON_RUFF_CONFIG_FILE: pyproject.toml
PYTHON_RUFF_FORMAT_CLI_LINT_MODE: project
PYTHON_RUFF_FORMAT_CONFIG_FILE: pyproject.toml

# Syft SBOM generation (project mode). Produces CycloneDX + SPDX JSON artifacts.
REPOSITORY_SYFT_ARGUMENTS: >-
  -o cyclonedx-json=artifacts/sbom-cyclonedx.json
  -o spdx-json=artifacts/sbom-spdx.json

# YAML Yamllint
YAML_YAMLLINT_ARGUMENTS: "--strict"

############################################
# Performance & Misc
############################################

FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
PARALLEL: true
SHOW_ELAPSED_TIME: true
SHOW_SKIPPED_LINTERS: false
PRINT_ALPACA: false
# End of MegaLinter configuration
